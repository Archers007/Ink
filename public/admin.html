<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink · Admin</title>
<link rel="icon" href="/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/ink.css">
<link rel="stylesheet" href="/css/style.css">
<style>
  .adm { max-width: 1180px; margin: 0 auto; padding: 18px 20px 60px; }
  .adm-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .adm-top h1 { margin: 0; font-size: 26px; }
  .adm-top .sp { flex: 1; }
  .tabs { display: flex; gap: 6px; margin: 10px 0 16px; }
  .tabs button { background: none; border: 1px solid var(--line); color: var(--fg); padding: 7px 14px; border-radius: 10px; cursor: pointer; font: inherit; }
  .tabs button.on { border-color: var(--gilt); color: var(--gilt-hi); background: rgba(217,180,90,.08); }
  .pane[hidden] { display: none; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .box { background: var(--ink-panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .box h2 { margin: 0 0 10px; font-size: 17px; }
  .form label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .form input[type=text], .form textarea { width: 100%; box-sizing: border-box; background: var(--ink-panel-2); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; padding: 9px 11px; font: inherit; }
  .form textarea { min-height: 130px; resize: vertical; }
  .drop { border: 1px dashed var(--line); border-radius: 10px; padding: 10px; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; }
  .drop.has { border-style: solid; }
  .drop img { max-width: 100%; max-height: 180px; border-radius: 8px; display: block; margin: 6px auto 0; }
  .form .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .msg { font-size: 13px; color: var(--muted); }
  .msg.err { color: var(--ember); }
  .issues { display: flex; flex-direction: column; gap: 8px; }
  .iss { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: start; background: var(--ink-panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .iss[data-open] { cursor: pointer; }
  .iss[data-open]:hover { border-color: rgba(217,180,90,.35); }
  .iss .num { color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 2px; }
  .iss:not([data-open]) .num { padding-left: 20px; }   /* line the numbers up with rows that have a toggle */
  .chev { width: 18px; flex: none; background: none; border: 0; padding: 0; color: var(--gilt); font-size: 15px; line-height: 1; cursor: pointer; }
  .chev:hover, .iss[data-open]:hover .chev { color: var(--gilt-hi); }
  .iss .t .ext { font-size: 11px; color: var(--muted); font-weight: 400; }
  .iss .t { font-weight: 700; }
  .iss .t a { color: var(--fg); text-decoration: none; }
  .iss .t a:hover { color: var(--gilt-hi); }
  .iss .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .lbl { font-size: 11px; padding: 1px 7px; border-radius: 8px; border: 1px solid; }
  .st { font-size: 11.5px; padding: 2px 8px; border-radius: 8px; background: #263066; white-space: nowrap; }
  .st.queued, .st.creating { background: #4a3a14; } .st.agent { background: #1d4f3a; } .st.issue { background: #2d3f80; } .st.done { background: #1d4f3a; } .st.failed, .st.cancelled { background: #7a1d1d; }
  .st.pr { background: #2d3f80; } a.st { text-decoration: none; color: var(--fg); } a.st:hover { filter: brightness(1.2); }
  .iss.closed { opacity: .8; } .iss.closed .t a { text-decoration: line-through; text-decoration-color: rgba(255,255,255,.35); }
  .box h2.toggle { cursor: pointer; user-select: none; margin-bottom: 0; } .box h2.toggle + .issues { margin-top: 10px; }
  table.hist td:nth-child(3) { line-height: 1.5; }
  .iss .acts { display: flex; gap: 6px; flex-direction: column; align-items: flex-end; }
  .iss .acts button, .iss .acts a { font-size: 12px; padding: 4px 9px; }
  /* closed rows show three whole lines of the body; open ones all of it, with the screenshots */
  .iss .body { font-size: 12.5px; line-height: 1.45; color: var(--mist); margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .iss:not(.open) .body { white-space: normal; }   /* the preview runs paragraphs together instead of spending a line on a gap */
  .iss.open .body { display: block; -webkit-line-clamp: none; line-clamp: none; }
  .src { font-size: 11.5px; padding: 2px 8px; border-radius: 8px; white-space: nowrap; border: 1px solid; }
  .src.bug { color: #f0a0a0; border-color: rgba(215,58,74,.55); } .src.feature { color: #9fe3ee; border-color: rgba(120,210,230,.5); }
  .imgchip { display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 7px; border-radius: 7px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .shots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .iss:not(.open) .shots { display: none; }
  .iss .shot { max-width: 220px; max-height: 160px; object-fit: cover; border-radius: 8px; display: block; border: 1px solid var(--line); }
  table.users { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.users th, table.users td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  table.users th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  table.users select { background: var(--ink-panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font: inherit; }
  tr.udecks > td { background: var(--ink-panel-2); padding: 10px 12px; }
  .udeck-list { display: flex; flex-direction: column; gap: 6px; }
  .udeck { border: 1px solid var(--line); border-radius: 10px; background: rgba(0,0,0,.15); }
  .udeck-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; cursor: pointer; }
  .udeck-head .spacer { flex: 1; }
  .udeck .inks { display: inline-flex; gap: 3px; }
  .inkdot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,.3); }
  .inkdot.ink-amber { background: #f3b72f; } .inkdot.ink-amethyst { background: #8b4fa8; } .inkdot.ink-emerald { background: #2f9e5a; }
  .inkdot.ink-ruby { background: #d0343f; } .inkdot.ink-sapphire { background: #2d7fc4; } .inkdot.ink-steel { background: #9aa4ae; }
  .vis { font-size: 11px; padding: 1px 8px; border-radius: 8px; border: 1px solid; }
  .vis.private { color: #f0c27a; border-color: rgba(240,194,122,.5); } .vis.shared { color: #9fe3a8; border-color: rgba(120,220,140,.5); }
  .udeck-cards { list-style: none; margin: 0; padding: 4px 12px 10px 12px; columns: 2 260px; column-gap: 24px; font-size: 13px; }
  .udeck-cards li { padding: 2px 0; break-inside: avoid; }
  .udeck-cards .q { display: inline-block; min-width: 2.2em; color: var(--gilt-hi, #f2dc9b); font-weight: 700; }
  .invite { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .invite select, .invite input[type=text] { background: var(--ink-panel-2); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; padding: 8px 10px; font: inherit; }
  .invite input[type=text] { flex: 1; min-width: 160px; }
  .linkout { display: flex; gap: 8px; align-items: center; background: var(--ink-panel-2); border: 1px solid var(--gilt); border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; font-size: 13px; }
  .linkout code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--gilt-hi); }
  .switch { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .switch:last-child { border-bottom: 0; }
  .switch b { display: block; } .switch .note { display: block; }
  .switch .sp { flex: 1; }
  .switch input { width: 20px; height: 20px; }
  .warn { background: rgba(217,120,60,.12); border: 1px solid rgba(217,120,60,.4); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
  .gate { max-width: 520px; margin: 80px auto; text-align: center; }
  .gate h1 { font-size: 30px; margin: 0 0 6px; }
  .gate .gate-form { text-align: left; max-width: 380px; margin: 18px auto; }
  .gate-acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<main class="adm" id="app">
  <div class="gate"><p class="note">Loading…</p></div>
</main>
<script type="module" src="/js/version.js"></script>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
