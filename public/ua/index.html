<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink · Union Arena deck builder</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b1f">
<meta name="description" content="Build Union Arena decks, then play them in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/ink.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/ua.css">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><polygon points='8,1 14,4.5 14,11.5 8,15 2,11.5 2,4.5' fill='%23d9b45a'/></svg>">
</head>
<body class="ua">
<header class="topbar">
  <a class="brandmark" href="/ua">Ink<small>Union Arena</small></a>
  <nav class="tabs" aria-label="Sections">
    <a href="/ua" aria-current="page">Decks</a>
    <a href="/ua/play">Play</a>
    <span class="sep">|</span>
    <a href="/" title="Ink's Disney Lorcana deck builder">Lorcana</a>
  </nav>
  <span class="grow"></span>
  <div id="accountBox" class="account"></div>
</header>
<div id="notice" class="notice" hidden></div>

<main class="ua-builder">
  <section class="ua-pool" aria-label="Card pool">
    <div class="ua-filters">
      <select id="title" aria-label="Title"></select>
      <input id="q" type="search" placeholder="Search name, text, affinity…" aria-label="Search cards">
      <div class="chips" id="colors" aria-label="Colour"></div>
      <select id="type" aria-label="Card type">
        <option value="">All types</option><option value="character">Characters</option><option value="site">Sites</option><option value="event">Events</option>
      </select>
      <select id="energy" aria-label="Required energy">
        <option value="">Any energy</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6+</option>
      </select>
      <select id="trig" aria-label="Trigger">
        <option value="">Any trigger</option><option value="none">No trigger</option><option value="draw">Draw</option><option value="get">Get</option><option value="raid">Raid</option><option value="active">Active</option><option value="special">Special</option><option value="color">Color</option><option value="final">Final</option>
      </select>
    </div>
    <div id="grid" class="ua-grid"></div>
    <div class="ua-more"><button id="more" class="btn btn-quiet" hidden>Show more</button></div>
  </section>

  <aside class="ua-deck" aria-label="Deck">
    <div class="row">
      <input id="deckName" type="text" placeholder="Deck name" aria-label="Deck name" style="flex:1">
      <span id="count" class="count">0/50</span>
    </div>
    <div class="row">
      <button id="save" class="btn btn-gold btn-sm">Save</button>
      <button id="mine" class="btn btn-sm">My decks</button>
      <button id="newDeck" class="btn btn-quiet btn-sm">New</button>
      <button id="io" class="btn btn-quiet btn-sm">Import / export</button>
      <a id="playIt" class="btn btn-quiet btn-sm" href="/ua/play">Play</a>
    </div>
    <label class="ua-note" id="shareWrap"><input type="checkbox" id="share"> Share with other Ink players</label>
    <div class="ua-curve" id="curve" aria-label="Required energy curve"></div>
    <div style="height:14px"></div>
    <ul id="problems" class="ua-problems"></ul>
    <div id="list" class="list"></div>
    <p class="ua-note" id="saveNote"></p>
  </aside>
</main>

<dialog id="detailModal" class="modal wide"><div class="modal-head"><h2 id="detailTitle"></h2><button class="x" data-close aria-label="Close">✕</button></div><div class="body" id="detailBody"></div></dialog>
<dialog id="mineModal" class="modal"><div class="modal-head"><h2>My Union Arena decks</h2><button class="x" data-close aria-label="Close">✕</button></div><div class="body"><div id="mineList" class="ua-mydecks"></div></div></dialog>
<dialog id="ioModal" class="modal"><div class="modal-head"><h2>Import / export</h2><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="body"><p class="ua-note">One card per line: <code>4 HTR-1-001</code>. Card numbers from the official card list work with or without the product prefix.</p><textarea id="ioText" rows="14"></textarea></div>
  <div class="actions"><button class="btn btn-quiet" id="ioCopy">Copy</button><button class="btn btn-gold" id="ioLoad">Load this list</button></div></dialog>
<dialog id="accountModal" class="modal"><div class="modal-head"><h2>Account</h2><button class="x" data-close aria-label="Close">✕</button></div><div class="body" id="accountBody"></div></dialog>

<script type="module" src="/ua/js/builder.js"></script>
</body>
</html>
