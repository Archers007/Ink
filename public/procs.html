<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink · Card rules</title>
<meta name="description" content="Every Disney Lorcana card's rules text, what its keywords mean, the official FAQ, and whether Ink plays it for you.">
<meta name="theme-color" content="#080b1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/ink.css">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><polygon points='8,1 14,4.5 14,11.5 8,15 2,11.5 2,4.5' fill='%23d9b45a'/></svg>">
<link rel="stylesheet" href="/css/rules.css">
</head>
<body>
<header class="top">
  <a class="brandmark" href="/">Ink</a>
  <nav class="tabs" aria-label="Sections"><a href="/play">Play</a><a href="/">Decks</a><a href="/lab" title="Watch the AI build a deck around your cards">Deck Lab</a><a href="/rules" aria-current="page">Card rules</a></nav>
  <span class="grow"></span>
  <button id="engineBtn" class="btn btn-quiet btn-sm" hidden aria-pressed="false" title="Admins: show how the engine compiles each card (procs, read-backs, coverage)">🔧 Engine view</button>
  <span id="acct" class="acct"></span>
</header>
<dialog id="signIn" class="signin-dlg" aria-labelledby="signInTitle">
  <div class="sd-head"><h2 id="signInTitle">Sign in</h2><button class="x" aria-label="Close" data-close-dlg>✕</button></div>
  <p class="hint">Sign in so your decks follow you between phone and desktop.</p>
  <div id="signInBody"></div>
</dialog>
<main class="rules">
  <aside id="side" aria-label="Find a card">
    <div class="find">
      <input id="q" class="field-in" type="search" placeholder="Search by name or rules text" autocomplete="off" aria-label="Search cards">
      <div class="inks" role="group" aria-label="Ink">
        <button class="ink" data-ink="amber" aria-pressed="false" title="Amber"></button><button class="ink" data-ink="amethyst" aria-pressed="false" title="Amethyst"></button><button class="ink" data-ink="emerald" aria-pressed="false" title="Emerald"></button><button class="ink" data-ink="ruby" aria-pressed="false" title="Ruby"></button><button class="ink" data-ink="sapphire" aria-pressed="false" title="Sapphire"></button><button class="ink" data-ink="steel" aria-pressed="false" title="Steel"></button>
        <select id="type" aria-label="Card type"><option value="">All types</option><option value="character">Characters</option><option value="action">Actions</option><option value="song">Songs</option><option value="item">Items</option><option value="location">Locations</option></select>
      </div>
      <div id="kwChip" class="kwchip" hidden></div>
    </div>
    <div id="meta" class="meta" role="status"></div>
    <div id="list" role="listbox" aria-label="Cards"></div>
  </aside>
  <section id="detail" tabindex="-1"></section>
</main>
<div id="zoom" hidden role="dialog" aria-label="Card, full size"></div>
<script type="module" src="/js/rules.js"></script>
</body>
</html>
